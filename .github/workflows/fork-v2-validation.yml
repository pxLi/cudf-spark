name: Fork AWS2 inventory for 45957698780
on:
  push:
    branches: [validation/gpu-ci-17162-20261127]
permissions: {contents: read}

jobs:
  observe:
    if: >-
      github.repository == 'pxLi/cudf-spark' && github.event_name == 'push' &&
      github.ref == 'refs/heads/validation/gpu-ci-17162-20261127' &&
      github.sha == vars.FORK_DB_V2_SHA && github.run_attempt == 1
    environment: gpu-ci-sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - name: Inspect the prior fork cell without allocating or deleting compute
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: /usr/bin/python3 -IB .github/workflows/fork-validation/reconcile_45957698780.py
