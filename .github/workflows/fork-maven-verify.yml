name: Fork Maven dependency seed
on:
  push:
    branches: [validation/maven-17162-20261127]
permissions:
  contents: read
jobs:
  seed:
    if: github.repository == 'pxLi/cudf-spark'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.m2/repository
          key: spark-maven-Linux-X64-2.13-main-for-db-seed
          restore-keys: spark-maven-Linux-X64-2.13-main-
          fail-on-cache-miss: true
      - run: bash .github/workflows/databricks-ci/prime_legacy_maven.sh
      - name: Pack real Scala dependencies and run Maven 3.8.1 offline using only the seed
        run: python3 -IB .github/workflows/fork-validation/full_seed.py
